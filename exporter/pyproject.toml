[project]
name = "ria-exporter"
version = "0.1.0"
description = "RIA news exporter as a test task"
authors = [
    {name = "andreyfesunov",email = "fsnv04@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "fastapi (>=0.115.0,<1.0.0)",
    "pydantic-settings (>=2.6.0,<3.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "uvicorn[standard] (>=0.32.0,<1.0.0)",
    "requests-ratelimiter (>=0.9.2,<0.10.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "ria_exporter", from = "src"}]

[dependency-groups]
dev = [
    "httpx (>=0.28.0,<1.0.0)",
    "mypy (>=1.11.0,<2.0.0)",
    "pre-commit (>=4.0.0,<5.0.0)",
    "pytest (>=8.0.0,<9.0.0)",
    "ruff (>=0.9.0,<1.0.0)",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requests hit real ria.ru (set RUN_LIVE_RIA_TESTS=1)",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]
extend-exclude = ["*.ipynb", ".ipynb_checkpoints"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]

[tool.ruff.lint.per-file-ignores]
"**/api/v1/router.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
strict = false
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "requests.*",
    "bs4.*",
    "requests_ratelimiter.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
